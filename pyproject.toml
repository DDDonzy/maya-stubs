[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "types-maya-local"
version = "2024.1.0"
description = "Type stubs for Autodesk Maya Python API (generated from Maya 2024)"
requires-python = ">=3.11"

[tool.setuptools]
# 仓库根目录即 maya-stubs 存根包（PEP 561 布局 B：{name}-stubs）
package-dir = { "maya-stubs" = "." }
packages = ["maya-stubs", "maya-stubs.api"]

[tool.setuptools.package-data]
"maya-stubs" = ["*.pyi"]
"maya-stubs.api" = ["*.pyi"]
