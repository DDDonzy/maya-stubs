[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "types-maya-local"
version = "2024.1.0"
description = "Type stubs for Autodesk Maya Python API (generated from Maya 2024)"
requires-python = ">=3.11"

[tool.setuptools]
# 存根包位于仓库根的 maya-stubs/ 子目录（PEP 561 布局 B：{name}-stubs）
packages = ["maya-stubs", "maya-stubs.api"]

[tool.setuptools.package-data]
"maya-stubs" = ["*.pyi"]
"maya-stubs.api" = ["*.pyi"]

[tool.ty.rules]
# cmds 参数已简化为 *args, **kwargs；overload 返回与实现返回的差异由运行时保证
invalid-argument-type = "ignore"
invalid-parameter-default = "ignore"
invalid-overload = "ignore"
